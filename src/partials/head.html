<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  {{baseTag}}
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{fullTitle}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta name="robots" content="{{robots}}">
  <meta name="theme-color" content="#1f2b23">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Horse &amp; Hive Farm">
  <meta property="og:title" content="{{fullTitle}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preload" href="assets/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.min.css">
  <script>document.documentElement.classList.add('js')</script>
  <script src="assets/js/main.min.js" defer></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": ["LocalBusiness", "SportsActivityLocation"],
    "@id": "https://horseandhive.com/#farm",
    "name": "Horse & Hive Farm",
    "description": "Riding lessons, horse boarding, summer camp and farm-fresh honey in Hydes, Maryland.",
    "url": "https://horseandhive.com/",
    "image": "https://horseandhive.com/assets/img/og-image.jpg",
    "logo": "https://horseandhive.com/assets/img/apple-touch-icon.png",
    "telephone": "+1-443-606-4639",
    "email": "hhfarm2012@gmail.com",
    "priceRange": "$$",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "13220 Long Green Pike",
      "addressLocality": "Hydes",
      "addressRegion": "MD",
      "postalCode": "21082",
      "addressCountry": "US"
    },
    "areaServed": ["Baltimore County", "Harford County"],
    "sameAs": ["https://www.facebook.com/horseandhive/", "https://www.instagram.com/horseandhive/"]
  }
  </script>
</head>
